{% extends 'base.html' %}{% block content %}<section class="panel"><div class="panelhead"><h2>Demo credit-weighted overall GPA</h2></div><div class="scroll"><table><thead><tr><th>Student ID</th><th>Student</th><th>Graded credits</th><th>GPA</th></tr></thead><tbody>{% for r in items %}<tr><td>{{r.student_id}}</td><td>{{r.full_name}}</td><td>{{r.graded_credits}}</td><td>{{r.gpa if r.gpa is not none else 'Not available'}}</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
